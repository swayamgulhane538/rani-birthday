<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
    <defs>
      <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#280816" />
        <stop offset="50%" stop-color="#18040a" />
        <stop offset="100%" stop-color="#cf6a87" />
      </linearGradient>
      <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffeaa7" />
        <stop offset="100%" stop-color="#dfb15b" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    
    <!-- Background Frame -->
    <rect width="100%" height="100%" fill="url(#bg7)" />
    <rect x="25" y="25" width="750" height="950" rx="20" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
    <rect x="45" y="45" width="710" height="910" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Decorative Stars -->
    <text x="100" y="120" font-size="28" fill="#ffd700" opacity="0.8">✨</text>
    <text x="700" y="120" font-size="28" fill="#ffd700" opacity="0.8">✨</text>
    <text x="100" y="880" font-size="28" fill="#ffd700" opacity="0.8">✨</text>
    <text x="700" y="880" font-size="28" fill="#ffd700" opacity="0.8">✨</text>

    <!-- Center Heart Emblem -->
    <circle cx="400" cy="420" r="170" fill="rgba(255,255,255,0.06)" stroke="url(#gold)" stroke-width="2" filter="url(#glow)" />
    
    <!-- Stylized Heart -->
    <path d="M 400 480 C 350 420 280 370 280 300 C 280 230 340 190 400 240 C 460 190 520 230 520 300 C 520 370 450 420 400 480 Z" 
          fill="#cf6a87" opacity="0.9" filter="url(#glow)"/>

    <text x="400" y="325" font-family="'Georgia', serif" font-size="22" font-style="italic" fill="#ffffff" text-anchor="middle" font-weight="bold">Rani &amp; Swayam</text>
    <text x="400" y="355" font-family="sans-serif" font-size="14" fill="#ffeaa7" text-anchor="middle" letter-spacing="3">3 MONTHS OF LOVE</text>

    <!-- Caption Info -->
    <rect x="150" y="630" width="500" height="42" rx="21" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)" />
    <text x="400" y="657" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dfb15b" text-anchor="middle" letter-spacing="2">MEMORY #7</text>

    <text x="400" y="730" font-family="'Georgia', serif" font-size="30" font-style="italic" fill="#ffffff" text-anchor="middle" font-weight="bold">Holding Your Hand in Mine</text>
    
    <text x="400" y="780" font-family="sans-serif" font-size="16" fill="rgba(255,255,255,0.7)" text-anchor="middle">Replace with real image in images/photo7.jpg</text>
    
    <circle cx="400" cy="840" r="24" fill="rgba(255,255,255,0.1)" stroke="url(#gold)" stroke-width="1" />
    <text x="400" y="848" font-size="18" fill="#ff758c" text-anchor="middle">💖</text>
  </svg>